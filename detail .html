<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annonce — Hélice</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy: #1E3A4C; --navy-light: #2C5170; --sand: #F7F1E6; --card: #FFFFFF;
    --gold: #D99B2B; --terracotta: #C1571F; --ink: #22303A; --ink-soft: #5B6B74;
    --line: #E3DACB; --whatsapp: #25D366; --call: #D6336C; --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'Work Sans', sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Fraunces', serif;margin:0 0 .3em 0;color:var(--navy);font-weight:600;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  header.site{background:var(--navy);color:#fff;padding:16px 5vw;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces', serif;font-size:1.35rem;font-weight:700;}
  .brand img{width:34px;height:34px;border-radius:8px;background:#fff;padding:3px;}
  .btn{border:none;border-radius:999px;padding:11px 22px;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;}
  .btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;}
  .section{max-width:820px;margin:0 auto;padding:30px 5vw 70px;}
  .back-link{display:inline-block;margin-bottom:18px;color:var(--navy);font-weight:600;text-decoration:none;}
  .carousel{position:relative;aspect-ratio:4/3;background:#dcd3c1;overflow:hidden;border-radius:var(--radius);}
  .carousel img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .35s ease;}
  .carousel img.active{opacity:1;}
  .carousel .empty-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b8064;}
  .carousel-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(30,58,76,.55);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:1.1rem;}
  .carousel-nav.prev{left:12px;} .carousel-nav.next{right:12px;}
  .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);}
  .dots span.active{background:#fff;width:16px;border-radius:4px;}
  .transaction-badge{position:absolute;top:12px;left:12px;padding:6px 14px;border-radius:999px;font-size:.78rem;font-weight:700;color:#fff;}
  .transaction-badge.location{background:var(--gold);color:#2B1B02;} .transaction-badge.vente{background:var(--terracotta);}
  .price{color:var(--gold);font-family:'Fraunces',serif;font-weight:700;font-size:1.8rem;margin-top:22px;}
  .title{font-size:1.4rem;margin:4px 0 10px;}
  .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-soft);font-size:.92rem;margin-bottom:16px;}
  .meta span{display:flex;align-items:center;gap:6px;}
  .desc{color:var(--ink);font-size:.98rem;white-space:pre-line;margin-bottom:24px;}
  .contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .pill{flex:1;min-width:120px;border:none;border-radius:999px;padding:13px 14px;color:#fff;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
  .pill svg{width:16px;height:16px;}
  .pill-sms{background:var(--gold);} .pill-wa{background:var(--whatsapp);} .pill-call{background:var(--call);}
  .seller-box{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;}
  .seller-avatar{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#2B1B02;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .seller-avatar img{width:100%;height:100%;object-fit:cover;}
  .not-found{text-align:center;padding:60px 20px;color:var(--ink-soft);}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html" style="text-decoration:none;">
    <img src="logo.png" alt="Hélice"> Hélice
  </a>
  <a class="btn btn-outline" href="index.html">← Retour aux annonces</a>
</header>

<section class="section" id="content">
  <div class="not-found">Chargement...</div>
</section>

<script>
const SUPABASE_URL = 'https://habcdsgqcyfpdrnvwunz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhYmNkc2dxY3lmcGRybnZ3dW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDY2NDQsImV4cCI6MjEwNDA4MjY0NH0.wlJklpJ4dS9kc0Yc6ntxG81EVtnaDf_flHk3P4J3Dwk';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function normalizePhone(raw){
  let d = raw.replace(/\D/g,'');
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('0')) d = '243' + d.slice(1);
  else if(!d.startsWith('243') && d.length <= 10) d = '243' + d;
  return d;
}
function iconSMS(){return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v12H7l-3 3V4z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function iconWA(){return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.7 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1.1.1-1.7-.1-.4-.1-1-.3-1.6-.6-2.9-1.2-4.8-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3 0-1.4.8-2.1 1-2.4.2-.2.5-.3.8-.3h.6c.2 0 .4 0 .6.5.2.6.7 1.9.8 2 .1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.5 1.5.3.1.5.1.7-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';}
function iconCall(){return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';}
function iconPin(){return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21z" stroke="#5B6B74" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.3" stroke="#5B6B74" stroke-width="1.6"/></svg>';}
function iconRoom(){return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#5B6B74" stroke-width="1.6"/><path d="M12 3v18M3 12h18" stroke="#5B6B74" stroke-width="1.6"/></svg>';}

function logClick(listingId, kind){
  supabaseClient.rpc('increment_click', { listing_id: listingId, kind }).then(()=>{}).catch(()=>{});
}

let currentPhotos = [];
function shiftPhoto(dir){
  const el = document.querySelector('.carousel');
  const imgs = [...el.querySelectorAll('img')];
  const dots = [...el.querySelectorAll('.dots span')];
  let current = imgs.findIndex(i => i.classList.contains('active'));
  imgs[current].classList.remove('active');
  dots[current] && dots[current].classList.remove('active');
  current = (current + dir + imgs.length) % imgs.length;
  imgs[current].classList.add('active');
  dots[current] && dots[current].classList.add('active');
}

async function loadDetail(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const content = document.getElementById('content');
  if(!id){
    content.innerHTML = '<div class="not-found">Annonce introuvable.</div>';
    return;
  }
  const { data: l, error } = await supabaseClient.from('annonces').select('*').eq('id', id).maybeSingle();
  if(error || !l){
    content.innerHTML = '<div class="not-found">Cette annonce n\'existe plus ou a été retirée.</div>';
    return;
  }

  supabaseClient.rpc('increment_view', { listing_id: l.id }).then(()=>{}).catch(()=>{});

  let sellerHtml = '';
  const { data: profile } = await supabaseClient.from('profiles').select('*').eq('user_id', l.user_id).maybeSingle();
  if(profile){
    const letter = (profile.username || 'A').charAt(0).toUpperCase();
    const avatarInner = profile.avatar_url ? `<img src="${profile.avatar_url}">` : escapeHtml(letter);
    sellerHtml = `<div class="seller-box"><div class="seller-avatar">${avatarInner}</div><div>Publié par <strong>${escapeHtml(profile.username || 'Annonceur')}</strong></div></div>`;
  }

  const phoneDigits = normalizePhone(l.phone);
  const msg = encodeURIComponent('Bonjour, je suis intéressé(e) par votre annonce sur Hélice : ' + l.title);
  const waLink = 'https://wa.me/' + phoneDigits + '?text=' + msg;
  const telLink = 'tel:+' + phoneDigits;
  const smsLink = 'sms:+' + phoneDigits + '?body=' + msg;
  const photos = l.photos && l.photos.length ? l.photos : [];
  const slides = photos.length
    ? photos.map((p,i) => `<img src="${p}" class="${i===0?'active':''}">`).join('')
    : '<div class="empty-ph">Pas de photo</div>';
  const dots = photos.length > 1 ? `<div class="dots">${photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>` : '';
  const arrows = photos.length > 1
    ? `<button class="carousel-nav prev" onclick="shiftPhoto(-1)">‹</button><button class="carousel-nav next" onclick="shiftPhoto(1)">›</button>`
    : '';
  const priceLabel = l.price_on_request ? 'Prix sur demande' : (l.price ? '$' + Number(l.price).toLocaleString('fr-FR') : 'Prix sur demande');
  const locationLabel = l.city === 'Kinshasa' && l.commune ? `${l.commune}, Kinshasa` : l.city;
  const badgeClass = l.transaction === 'vente' ? 'vente' : 'location';
  const badgeLabel = l.transaction === 'vente' ? 'À vendre' : 'À louer';
  const dateLabel = new Date(l.created_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  content.innerHTML = `
    <a class="back-link" href="index.html">← Retour aux annonces</a>
    <div class="carousel">${slides}<div class="transaction-badge ${badgeClass}">${badgeLabel}</div>${dots}${arrows}</div>
    <div class="price">${priceLabel}</div>
    <h1 class="title">${escapeHtml(l.title)}</h1>
    <div class="meta">
      <span>${iconPin()} ${escapeHtml(locationLabel)}</span>
      ${l.rooms ? `<span>${iconRoom()} ${l.rooms} pièces</span>` : ''}
      <span>Publié le ${dateLabel}</span>
    </div>
    ${sellerHtml}
    ${l.description ? `<div class="desc">${escapeHtml(l.description)}</div>` : ''}
    <div class="contact-row">
      <a class="pill pill-sms" href="${smsLink}" onclick="logClick(${l.id},'sms')">${iconSMS()} SMS</a>
      <a class="pill pill-wa" href="${waLink}" target="_blank" rel="noopener" onclick="logClick(${l.id},'whatsapp')">${iconWA()} WhatsApp</a>
      <a class="pill pill-call" href="${telLink}" onclick="logClick(${l.id},'call')">${iconCall()} Appel</a>
    </div>
  `;
}
loadDetail();
</script>
</body>
</html>
